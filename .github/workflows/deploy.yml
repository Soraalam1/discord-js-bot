name: Deploy to NAS

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/discord-js-bot:latest
            ghcr.io/${{ github.repository_owner }}/discord-js-bot:${{ github.sha }}

      - name: Deploy to NAS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT }}
          script: |
            echo "Navigating to bot directory..."
            cd /volume2/docker/discord-bot
            
            echo "Pulling latest image..."
            docker-compose pull
            
            echo "Restarting container..."
            docker-compose up -d
            
            echo "Checking container status..."
            docker-compose ps
            
            echo "Recent logs:"
            docker-compose logs --tail=20 discord-bot