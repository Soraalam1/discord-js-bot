name: Simple Deploy

on:
  push:
    branches: [ master ]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
    - name: Launch bot
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: >-
          cd discord-js-bot/ && 
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - &&
          sudo apt-get -o Dpkg::Options::="--force-overwrite" install -y nodejs &&
          node -v &&
          sudo npm install -g pm2 && 
          pm2 stop Tsureimu && 
#          export BOT_TOKEN=${{ secrets.BOT_TOKEN }} &&
#          echo $BOT_TOKEN &&
#          export CLIENT_ID=${{ secrets.CLIENT_ID }} &&
#          echo $CLIENT_ID &&
#          export GUILD_ID=${{ secrets.GUILD_ID }} &&
#          echo $GUILD_ID &&
          git pull origin master &&
          npm install &&
          npm ci &&
          echo 'BOT_TOKEN=${{ secrets.BOT_TOKEN }}
                  
                CLIENT_ID=${{ secrets.CLIENT_ID }}
                  
                GUILD_ID=${{ secrets.GUILD_ID }}' >.env
          pm2 start Tsureimu && 
          exit
