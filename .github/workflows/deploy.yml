name: Simple Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Launch bot
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: >-
            sudo apt-get update &&
            cd discord-js-bot/ && 
            node -v &&
            sudo npm install -g pm2 && 
            git stash &&
            git pull origin master &&
            npm install &&
            npm ci &&
            pm2 stop all &&
            pm2 delete all &&
            DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }} DISCORD_GUILD_ID=${{ secrets.GUILD_ID }} DISCORD_CLIENT_ID=${{ secrets.CLIENT_ID }} &&
            node src/index.js
#            pm2 start src/index.js --name Tsureimu
